name: Deploy YAJI MOVE to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: yaji-move-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Vérifier la base D1 YAJI MOVE
        run: |
          if grep -q "A_REMPLACER_PAR_ID_BASE_D1_YAJI" wrangler.jsonc; then
            echo "::error::Ajoute l'ID de la base D1 yaji-move-pilotage-db dans wrangler.jsonc avant la mise en ligne."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply yaji-move-pilotage-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production
        continue-on-error: true
        env:
          REQUIRE_REFERENCE_BLACK_DESIGN: "1"
        run: node scripts/smoke-production.mjs

      # Lien court gratuit yajimove.pages.dev (Cloudflare Pages + liaison vers le Worker).
      # N'empêche jamais la mise en ligne principale : en cas d'échec, seule l'adresse courte manque.
      - name: Create short link project (first time only)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create yajimove --production-branch main

      # Le build du Worker laisse une redirection de config (.wrangler/deploy/config.json → dist/server)
      # que wrangler suivrait aussi pour Pages : on la retire, le Worker est déjà en ligne.
      - name: Prepare short link deploy
        run: rm -f .wrangler/deploy/config.json

      - name: Deploy short link yajimove.pages.dev
        id: short_link
        continue-on-error: true
        working-directory: short-link
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Lancé depuis short-link/ pour que wrangler lise short-link/wrangler.json (liaison SHOP).
        run: npx wrangler pages deploy public --project-name yajimove --branch main --commit-dirty=true

      - name: Verify short link
        if: steps.short_link.outcome == 'success'
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL https://yajimove.pages.dev/boutique | grep -q 'data-storefront-deployment="yaji-move-sport-v1"'; then echo "yajimove.pages.dev OK"; exit 0; fi
            sleep 10
          done
          echo "yajimove.pages.dev ne répond pas encore"; exit 1

